<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>别让深度阅读悄悄消失 · 知识卡片</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1b1f24; --muted:#5b6572;
    --line:#e4e7ec; --accent:#2f6df6; --note-bg:#f2f6ff; --note-line:#cfe0ff;
    --quote:#8a93a3; --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14171c; --panel:#1c2128; --ink:#e8ecf1; --muted:#9aa4b2;
      --line:#2b323b; --accent:#6ea8ff; --note-bg:#1a2333; --note-line:#2c3d5c;
      --quote:#7f8a99; }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.7;-webkit-font-smoothing:antialiased;}
  header{max-width:1100px;margin:0 auto;padding:40px 24px 8px;}
  header h1{margin:0 0 6px;font-size:26px;letter-spacing:.2px;}
  header .meta{color:var(--muted);font-size:14px;}
  .grid{max-width:1100px;margin:0 auto;padding:20px 24px 64px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 20px 18px;display:flex;flex-direction:column;gap:12px;
    box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .card .no{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.6px;}
  .card h2{margin:0;font-size:17px;line-height:1.5;}
  .field-label{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--muted);
    text-transform:uppercase;margin-bottom:4px;}
  .content{font-size:14.5px;}
  .content .quote{color:var(--quote);}
  .note{background:var(--note-bg);border:1px solid var(--note-line);border-radius:10px;
    padding:12px 14px;font-size:14px;}
  .note .tag{font-weight:700;color:var(--accent);}
  footer{max-width:1100px;margin:0 auto;padding:0 24px 48px;color:var(--muted);font-size:12.5px;}
  @media print{
    body{background:#fff;} .card{break-inside:avoid;box-shadow:none;} .grid{gap:12px;}
  }
</style>
</head>
<body>
<header>
  <h1>别让深度阅读悄悄消失 · 知识卡片</h1>
  <div class="meta">知识卡片 · 共 <span id="count">0</span> 张 · 由 first-try-article-skill 生成</div>
</header>
<main class="grid" id="deck"></main>
<footer>卡片内容忠于原文；「」内为原文引用，"补充/推断"为编者解读。</footer>
<script>
  var CARDS = [{"title": "作者主张：应把深度阅读当作需要刻意保护的能力", "content": "作者认为「我们应当有意识地保护深度阅读，把它当成一种需要刻意练习的能力」（第 1 段）。", "note": "这是全文的中心主张，属于作者立场，不是客观结论。"}, {"title": "作者担忧的不是读得少，而是读得浅", "content": "作者「担心的不是人们读得少了，而是读得浅了」，并指出碎片化阅读「正在成为主流」（第 1 段）。", "note": "把\"数量\"与\"深度\"分开，是本文立论的起点。"}, {"title": "作者反驳\"深度阅读已过时\"：持续注意本身就是思考的训练", "content": "针对\"深度阅读效率太低、已经过时\"的看法，作者主张其价值「不在于\"读完\"了多少字，而在于它强迫读者在较长时间里跟随一个复杂论证，这种持续注意本身就是思考的训练」；快速浏览「能让你知道\"有这回事\"，但很难让你理解\"为什么会这样\"」（第 2 段）。", "note": "\"持续注意是思考的训练\"是作者的论点，不是事实断言。"}, {"title": "作者并不全盘反对碎片化阅读", "content": "作者明确表示「我并不反对碎片化阅读。它适合获取新闻、查漏补缺，也确实降低了信息获取的门槛」（第 3 段）。", "note": "保留这处让步很关键，否则容易把作者误读为\"反对碎片化阅读\"的极端立场。"}, {"title": "作者的担忧：碎片化阅读挤占时间会削弱深度阅读能力", "content": "作者认为问题在于「当碎片化阅读挤占了几乎全部阅读时间，人们就会逐渐失去进入长文、久坐读完一本书的耐心」，并比喻「注意力像肌肉，越不用越弱」（第 3 段）。", "note": "\"注意力像肌肉\"是作者用来论证的比喻，属主张性表达，非科学结论。"}, {"title": "作者建议：每天留出不被打扰的时间专门读长文本", "content": "作者建议「每天留出一段不被打扰的时间，专门用来读需要动脑的长文本」，「把手机放到另一个房间」，读时「不追求速度，允许自己在难点停留」（第 4 段）。", "note": "原文承认这些做法\"未必立刻见效\"，但认为长期坚持可以让深度阅读能力被重新养回来。"}];
  function esc(s){return (s||"").replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function fmt(t){
    // 行内：**粗体**、「引用」、`代码`
    var h = esc(t);
    h = h.replace(/「([^」]*)」/g,'<span class="quote">「$1」</span>');
    h = h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    h = h.replace(/`([^`]+)`/g,'<code>$1</code>');
    h = h.replace(/\n/g,'<br>');
    return h;
  }
  var deck = document.getElementById('deck');
  document.getElementById('count').textContent = CARDS.length;
  CARDS.forEach(function(c,i){
    var el = document.createElement('article');
    el.className = 'card';
    el.innerHTML =
      '<div class="no">CARD ' + (i+1) + '</div>' +
      '<h2>' + fmt(c.title) + '</h2>' +
      '<div><div class="field-label">核心内容</div><div class="content">' + fmt(c.content) + '</div></div>' +
      '<div class="note"><div class="field-label">批注解释</div><div>' + fmt(c.note) + '</div></div>';
    deck.appendChild(el);
  });
</script>
</body>
</html>
