<script>
  var CARDS = [{"title": "\"人心日下\"是历来的叹声，所指却随时代迁移", "content": "「“世道浇漓，人心日下，国将不国”这一类话，本是中国历来的叹声」；不过「时代不同，则所谓“日下”的事情，也有迁变：从前指的是甲事，现在叹的或是乙事」（第 1 段）。", "note": "作者先点出\"人心不古\"是一种历久弥新的话术：其具体所指会随时代更换，可见它更像惯性，而非对事实的判断。"}, {"title": "叹\"人心日下\"既能针砭世人，又能把自己摘出去", "content": "「因为如此叹息，不但针砭世人，还可以从“日下”之中，除去自己」；所以「连杀人放火嫖妓骗钱以及一切鬼混的人，也都乘作恶余暇，摇着头说道，“他们人心日下了。”」（第 1 段）。", "note": "作者戳破这类叹息的\"功能\"：说\"人心日下\"的人，把自己排除在\"日下\"之外，从而获得道德上的豁免。"}, {"title": "世风人心的\"日下\"，也可以只是旁观与叹息", "content": "「世风人心这件事，不但鼓吹坏事，可以“日下”;即使未曾鼓吹，只是旁观，只是赏玩，只是叹息，也可以叫他“日下”」（第 2 段）。", "note": "指出\"日下\"的判定极宽泛：连不参与、只旁观叹息也算，标准本身是模糊的。"}, {"title": "不肯空谈者出来\"挽救\"：虚君共和与灵学请鬼", "content": "近一年来「有几个不肯徒托空言的人，叹息一番之后，还要想法子来挽救。第一个是康有为，指手画脚的说“虚君共和”才好，陈独秀便斥他不兴;其次是一班灵学派的人，不知何以起了极古奥的思想，要请“孟圣矣乎”的鬼来画策」（第 2 段）。", "note": "作者以\"请鬼画策\"的荒诞，点出这些\"挽救\"之法与二十世纪的时代极不相称。"}, {"title": "作者寒心：《新青年》上还在辩这等事，如同辩地球方圆", "content": "「这几篇驳论，都是《新青年》里最可寒心的文章」，因为「时候已是二十世纪了」；作者设喻：「假如《新青年》里，有一篇和别人辩地球方圆的文字，读者见了，怕一定要发怔」（第 3 段）。", "note": "\"寒心而且害怕\"的落点：时代已进步，论争的内容却退到常识以下。"}, {"title": "\"表彰节烈\"是新一轮\"挽救\"之法，且早已提倡多年", "content": "于是又「想出一种挽救的方法;他们叫作“表彰节烈”」；这类做法「自从君政复古时代以来，上上下下，已经提倡多年」（第 4、5 段）。", "note": "作者点明\"表彰节烈\"并非新发明，而是旧法再次竖起旗帜。"}, {"title": "倡\"节烈\"与叹\"日下\"一样，也是自我提拔的计较", "content": "因为「要不说这件事，也不能将自己提拔，出于 “人心日下”之中」（第 5 段）。", "note": "与开篇\"从日下之中除去自己\"呼应：提倡\"表彰节烈\"同样能让人站到道德高处。"}, {"title": "如今的\"节烈\"专指女子，男子不在其内", "content": "「节烈这两个字，从前也算是男子的美德，所以有过“节士”，“烈士”的名称。然而现在的“表彰节烈”，却是专指女子，并无男子在内」（第 6 段）。", "note": "作者强调\"节烈\"的对象被窄化为女性，这是全文批判的起点。"}, {"title": "\"节\"的界定：夫死不再嫁、不私奔，且愈早愈穷愈\"节\"", "content": "据时下道德家：「大约节是丈夫死了，决不再嫁，也不私奔，丈夫死得愈早，家里愈穷，他便节得愈好」（第 6 段）。", "note": "注意\"愈早愈穷，便节得愈好\"——道德评价竟与女子处境的苦难成正比。"}, {"title": "\"烈\"分两种：夫死自尽，或遇暴自戕、拒杀", "content": "「烈可是有两种：一种是无论已嫁未嫁，只要丈夫死了，他也跟着自尽;一种是有强暴来污辱他的时候，设法自戕，或者抗拒被杀，都无不可」（第 6 段）。", "note": "两种\"烈\"都以死亡为条件，区别只在死因。"}, {"title": "节烈的评价取向：\"死得愈惨愈苦，便愈好\"", "content": "「这也是死得愈惨愈苦，他便烈得愈好」；甚至「万一幸而遇着宽厚的道德家，有时也可以略迹原情，许他一个烈字」（第 6 段）。", "note": "作者揭示这套标准的吊诡：以惨苦程度衡量德行高低。"}, {"title": "作者概括\"节烈救世\"说的大意", "content": "「总而言之：女子死了丈夫，便守着，或者死掉;遇了强暴，便死掉;将这类人物，称赞一通，世道人心便好，中国便得救了。大意只是如此」（第 7 段）。", "note": "用一句话还原对方的全部逻辑，为后文逐条诘问作铺垫。"}, {"title": "作者认定\"节烈救世说\"是多数国民的意思，主张者只是喉舌", "content": "「我又认定这节烈救世说，是多数国民的意思;主张的人，只是喉舌」，因此「我这疑问和解答，便是提出于这群多数国民之前」（第 8 段）。", "note": "作者把批判对象从少数鼓吹者扩大为\"多数国民\"，声明诘问针对的是这种集体意识。"}, {"title": "疑问一：不节烈的女子如何害了国家？", "content": "作者认为那些乱象「只是不讲新道德新学问的缘故，行为思想，全钞旧帐」，且「政界军界学界商界等等里面，全是男人」；水旱饥荒「没有新知识的结果;更与女子无关」；至于刀兵盗贼造出不节烈的妇女，「也是兵盗在先，不节烈在后，并非因为他们不节烈了，才将刀兵盗贼招来」（第 9 段）。", "note": "作者以\"兵盗在先\"澄清因果次序，否定\"女子不节烈招致祸乱\"的说法。"}, {"title": "疑问二：救世的责任何以全在女子？", "content": "照旧派说，女子是「阴类」，是主内的、是「男子的附属品」，然则「治世救国，正须责成阳类」；依新说「则男女平等，义务略同」，纵令该担责任「也只得分担」（第 10 段）。", "note": "作者用旧说的自相矛盾（主内者反担治国之责）与新说的平等观，双向否定\"责任全在女子\"。"}, {"title": "疑问三：表彰之后，究竟有何效果？", "content": "作者把活着的女子分三类，最要紧的是尚未出嫁或丈夫还在的人；她们一经感化便立志「倘若将来丈夫死了，决不再嫁;遇着强暴，赶紧自裁!」（第 11 段）。", "note": "作者据此追问：这样的立志「与中国男子做主的世道人心，有何关系?」"}, {"title": "附带疑问：立志极高者，也可能只做一世次等人物", "content": "「圣贤虽人人可学，此事却有所不能。假如第三种的人，虽然立志极高，万一丈夫长寿，天下太平，他便只好饮恨吞声，做一世次等的人物」（第 11 段）。", "note": "指出\"节烈\"能否实现取决于丈夫何时死、有无强暴等偶然条件，个人无法自主成就。"}, {"title": "一问：节烈是否道德？", "content": "作者给出道德的条件：「道德这事，必须普遍，人人应做，人人能行，又于自他两利，才有存在的价值」；而节烈「不特除开男子，绝不相干;就是女子，也不能全体都遇着这名誉的机会。所以决不能认为道德，当作法式」（第 13 段）。", "note": "以\"普遍性\"为标尺，判定节烈不满足道德成立的条件。"}, {"title": "\"烈\"的第二种人：弱者遇暴徒而死，众人却只议论她", "content": "「这类人不过一个弱者(现在的情形，女子还是弱者)，突然遇着男性的暴徒，父兄丈夫力不能救，左邻右舍也不帮忙，于是他就死了」；事后众人「既不羞自己怯弱无能，也不提暴徒如何惩办，只是七口八嘴，议论他死了没有?受污没有?死了如何好，活着如何不好」（第 14 段）。", "note": "作者指向围观者的残忍：放过暴徒，却审判受害者，遂「造出了许多光荣的烈女，和许多被人口诛笔伐的不烈女」。"}, {"title": "二问：多妻主义的男子，有何表彰节烈的资格？", "content": "作者主张「既然平等，男女便都有一律应守的契约。男子决不能将自己不守的事，向女子特别要求」；「何况多妻主义的男子，来表彰女子的节烈」（第 15 段）。", "note": "以\"平等\"推出权利义务对等，否定不守约者的表彰资格。"}, {"title": "节烈的由来：从女子被视为物品、殉葬，到守节", "content": "「古代的社会，女子多当作男人的物品」，男人死后可令其「一同殉葬」；后来殉葬之风渐改，「守节便也渐渐发生。但大抵因为寡妇是鬼妻，亡魂跟着，所以无人敢娶，并非要他不事二夫」（第 17 段）。", "note": "作者从社会史角度说明：守节起初并非道德要求，而近于一种禁忌。"}, {"title": "\"饿死事小失节事大\"起于宋朝\"业儒\"，汉唐并无鼓吹节烈", "content": "「由汉至唐也并没有鼓吹节烈。直到宋朝，那一班“业儒”的才说出 “饿死事小失节事大”的话」（第 17 段）。", "note": "把节烈观念的来源定位到宋代\"业儒\"，说明它并非自古如此的\"天理\"。"}, {"title": "守节之盛与被征服的地位相关", "content": "「国民将到被征服的地位，守节盛了;烈女也从此着重」；因为被征服者「没有力量保护，没有勇气反抗了，只好别出心裁，鼓吹女人自杀」（第 18 段）。", "note": "作者揭示节烈与\"男子再娶\"的双重标准并存——男人再娶是天经地义，女人却被要求殉死。"}, {"title": "主张的是男子，上当的是女子", "content": "「但主张的是男子，上当的是女子」；女子「何以毫无异言呢?原来“妇者服也”，理应服事于人。教育固可不必，连开口也都犯法」（第 19 段）。", "note": "女性既被剥夺教育，又被剥夺发声机会，因此\"无异议\"并非出于自愿。"}, {"title": "男子也不主张真理：因\"业儒\"垄断了言论", "content": "「汉朝以后，言论的机关，都被“业儒”的垄断了」；「其余“异端”的声音，决不能出他卧房一步」，加之「不述而作，最为犯忌」，于是「即使有人见到，也不肯用性命来换真理」（第 20 段）。", "note": "作者说明：连男子也不敢讲真理，是言论被垄断与\"犯忌\"压力共同造成的。"}, {"title": "作者的声明：鼓吹者中或有好人，但救世的方法不对", "content": "「现在鼓吹节烈派的里面，我颇有知道的人。敢说确有好人在内，居心也好。可是救世的方法是不对，要向西走了北了」（第 21 段）。", "note": "作者刻意区分\"人\"与\"方法\"，避免把批判对象人格化，态度留有余地。"}, {"title": "节烈很难：社会只责女子的贞淫，男子却不负责任", "content": "「社会的公意，向来以为贞淫与否，全在女性。男子虽然诱惑了女人，却不负责任」；作者举甲乙为例，指出「甲男并无恶名」，过错却归乙女（第 23 段）。", "note": "由此「历史上亡国败家的原因，每每归咎女子」，作者说这是「糊糊涂涂的代担全体的罪恶，已经三千多年了」。"}, {"title": "节烈很苦：节妇生计无着，旌表也无人翻读", "content": "「单是生活一层，已是大宗的痛楚」；「有钱尚可，贫人便只能饿死」。即便身后旌表，「各府各县志书传记类的末尾，也总有几卷“烈女”」，而「赵钱孙李，可是从来无人翻读」（第 24 段）。", "note": "作者以\"无人翻读\"点出：这些传记，连崇奉节烈者自己也并不看。"}, {"title": "不节烈也很苦：被社会公意排挤、唾骂", "content": "「社会公意，不节烈的女人，既然是下品;他在这社会里，是容不住的」；「能用历史和数目的力量，挤死不合意的人」（第 25 段）。", "note": "作者称此为「无主名无意识的杀人团」，节烈者与不节烈者都死在它手里。"}, {"title": "女子自己并不愿意节烈", "content": "「节烈很难很苦，既不利人，又不利己。说是本人愿意，实在不合人情」；「可是无论何人，都怕这节烈。怕他竟钉到自己和亲骨肉的身上」（第 26 段）。", "note": "作者据此说明：节烈之所以\"牢不可破\"，是被\"历史和数目的力量挤着\"，而非出于自愿。"}, {"title": "结论：节烈已失去存在的生命和价值", "content": "作者断定节烈这事是「极难，极苦，不愿身受，然而不利自他，无益社会国家，于人生将来又毫无意义的行为，现在已经失了存在的生命和价值」（第 27 段）。", "note": "全文的总结论，集中回应前文所有的疑问与解答。"}, {"title": "节烈的女人仍有哀悼的价值", "content": "「节烈的女人，岂非白苦一番么?可以答他说：还有哀悼的价值。他们是可怜人;不幸上了历史和数目的无意识的圈套，做了无主名的牺牲」（第 29 段）。", "note": "作者把批判与同情分开：批判\"节烈\"这一观念，同情被它牺牲的人。"}, {"title": "作者的三条\"发愿\"", "content": "「要自己和别人，都纯洁聪明勇猛向上。要除去虚伪的脸谱。要除去世上害己害人的昏迷和强暴」；「要除去于人生毫无意义的苦痛」；「要人类都受正当的幸福」（第 30—32 段）。", "note": "结尾由批判转向期许，是全文的正面主张。"}];
  function esc(s){return (s||"").replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function fmt(t){
    // 行内：**粗体**、「引用」、`代码`
    var h = esc(t);
    h = h.replace(/「([^」]*)」/g,'<span class="quote">「$1」</span>');
    h = h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    h = h.replace(/`([^`]+)`/g,'<code>$1</code>');
    h = h.replace(/\n/g,'<br>');
    return h;
  }
  var deck = document.getElementById('deck');
  document.getElementById('count').textContent = CARDS.length;
  CARDS.forEach(function(c,i){
    var el = document.createElement('article');
    el.className = 'card';
    el.innerHTML =
      '<div class="no">CARD ' + (i+1) + '</div>' +
      '<h2>' + fmt(c.title) + '</h2>' +
      '<div><div class="field-label">核心内容</div><div class="content">' + fmt(c.content) + '</div></div>' +
      '<div class="note"><div class="field-label">批注解释</div><div>' + fmt(c.note) + '</div></div>';
    deck.appendChild(el);
  });
</script>
